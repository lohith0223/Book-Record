services:
  - type: web
    name: mba-reading-stand
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=*:10000 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
