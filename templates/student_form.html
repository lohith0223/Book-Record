{% extends "base.html" %}
{% block title %}New student | MBA Reading Stand{% endblock %}
{% block page_heading %}Create student account{% endblock %}
{% block content %}<a class="back-link" href="{{ url_for('students') }}"><i class="bi bi-arrow-left"></i> Back to students</a><section class="panel form-panel"><span class="eyebrow">STUDENT ACCOUNT</span><h2>New student</h2><p class="muted">Passwords are stored only as Werkzeug hashes.</p><form method="post" class="admin-form"><div class="form-two"><label>Student ID<input name="student_id" required placeholder="STU001"></label><label>USN<input name="usn" required placeholder="1AB23MBA001"></label></div><div class="form-two"><label>Full name<input name="full_name" required></label><label>College email<input type="email" name="college_email" required></label></div><div class="form-two"><label>Phone <span class="muted">(optional)</span><input name="phone"></label><label>Password<input type="password" name="password" required minlength="8"></label></div><div class="form-three"><label>Course<input name="course" value="MBA" required></label><label>Semester<input name="semester" required placeholder="2"></label><label>Section<input name="section" required placeholder="A"></label></div><button class="btn btn-dark">Create student account</button></form></section>{% endblock %}
