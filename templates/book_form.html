{% extends "base.html" %}
{% block title %}New book | MBA Reading Stand{% endblock %}
{% block page_heading %}Add book{% endblock %}
{% block content %}<a class="back-link" href="{{ url_for('books') }}"><i class="bi bi-arrow-left"></i> Back to inventory</a><section class="panel form-panel"><span class="eyebrow">BOOK RECORD</span><h2>New book</h2><p class="muted">The QR code is generated automatically from the unique Book ID.</p><form method="post" class="admin-form"><div class="form-two"><label>Book ID<input name="book_code" required placeholder="B001"></label><label>Title<input name="title" required placeholder="Atomic Habits"></label></div><div class="form-two"><label>Author<input name="author" required placeholder="James Clear"></label><label>ISBN <span class="muted">(optional)</span><input name="isbn"></label></div><div class="form-two"><label>Category<input name="category" required placeholder="Leadership"></label><label>Stand<select name="stand_id" required><option value="">Select stand</option>{% for stand in stands %}<option value="{{ stand.id }}">{{ stand.code }} · {{ stand.classroom or stand.zone }}</option>{% endfor %}</select></label></div><label>Description<textarea name="description" rows="4"></textarea></label><label>Status<select name="status"><option value="AVAILABLE">AVAILABLE</option><option value="READING">READING</option><option value="BORROWED">BORROWED</option></select></label><button class="btn btn-dark">Create book</button></form></section>{% endblock %}
